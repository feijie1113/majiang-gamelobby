<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121a19"><title>扑克牌比大小 · 麻酱的游戏厅</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><style>[hidden]{display:none!important}</style><script type="module" src="/compare.js"></script></head><body><div class="page"><header><a class="brand" href="/"><span class="mark">麻</span><strong>麻酱的游戏厅</strong></a><a class="back" href="/">← 回大厅</a></header><main class="compare-main"><div class="heading"><div><small>两个人的扑克牌小游戏</small><h1>比大小</h1></div><p>A 最小，K 最大。各选一张，同时翻牌；五局赢得多的人胜，打平就各发五张继续比。</p></div><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><section id="entry" class="board"><div class="felt entry"><div><h2>自己开一桌</h2><p>把房间链接发给朋友，等他进来就发牌。</p><button id="create-room" class="primary" type="button">创建房间</button></div><span class="or">或</span><form id="join-form"><h2>加入朋友的桌</h2><label for="room-code">八位房间号</label><div class="join-row"><input id="room-code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="输入房间号" required><button class="secondary" type="submit">加入</button></div></form></div></section><section id="game" hidden><div class="room-bar"><span>房间号 <strong id="room-label"></strong></span><button id="copy-link" class="link-button" type="button">复制邀请链接</button></div><div class="board"><div class="felt table"><div class="score"><div><small>你</small><strong id="my-score">0</strong></div><div><strong id="round-label">等朋友入座</strong><small id="turn-label"></small></div><div><small>朋友</small><strong id="other-score">0</strong></div></div><div id="reveal" class="reveal" aria-live="polite">先坐下，等朋友来。</div><div class="opponent"><span id="other-status">对方还没入座</span><div id="other-cards" class="backs" aria-hidden="true"></div></div></div></div><div class="hand-panel"><div class="hand-title"><strong id="hand-title">你的牌</strong><span id="hand-tip">选一张，等朋友也选好就一起翻开</span></div><div id="hand" class="hand" aria-label="你的手牌"></div><div id="finish-actions" class="finish" hidden><button id="rematch" class="primary" type="button">再来一局</button><span id="rematch-status"></span></div></div></section></main></div></body></html>
